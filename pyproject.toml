[project]
name = "beatbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "openai>=1.40",
    "librosa>=0.10",
    "numpy",
    "jsonschema>=4.20",
    "pyyaml",
    "rich",
    "matplotlib>=3.8",
    "soundfile>=0.14.0",
]

[project.scripts]
beatbench = "beatbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beatbench"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout",
    "soundfile>=0.14.0",
]
